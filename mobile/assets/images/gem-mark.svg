<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- GemBook brand mark — primary #CC10FE / accent #E281FF, transparent background -->
  <defs>
    <linearGradient id="gemBody" x1="18" y1="10" x2="110" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E281FF"/>
      <stop offset="45%" stop-color="#CC10FE"/>
      <stop offset="100%" stop-color="#A00AD0"/>
    </linearGradient>
    <linearGradient id="gemTop" x1="40" y1="12" x2="88" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gemLeft" x1="24" y1="40" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gemRight" x1="64" y1="40" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A00A8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7A00A8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Main gem silhouette -->
  <path
    d="M64 10 L108 42 L90 118 L38 118 L20 42 Z"
    fill="url(#gemBody)"
  />

  <!-- Crown facets -->
  <path d="M64 10 L108 42 L64 52 L20 42 Z" fill="url(#gemTop)"/>
  <path d="M20 42 L64 52 L38 118 Z" fill="url(#gemLeft)"/>
  <path d="M108 42 L64 52 L90 118 Z" fill="url(#gemRight)"/>

  <!-- Center pavilion highlight -->
  <path d="M64 52 L78 88 L64 118 L50 88 Z" fill="#FFFFFF" opacity="0.14"/>

  <!-- Table sparkle -->
  <circle cx="72" cy="28" r="3.2" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="52" cy="36" r="1.6" fill="#FFFFFF" opacity="0.55"/>
</svg>
