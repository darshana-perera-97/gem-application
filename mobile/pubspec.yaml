name: gem_mobile
description: GemBook mobile app — Flutter port of the React frontend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  cookie_jar: ^4.0.8
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  video_player: ^2.9.3
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
